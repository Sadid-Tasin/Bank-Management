spring.application.name=bank-management
spring.profiles.default=local

server.port=${PORT:8080}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT configuration
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.issuer=bank-management-system
app.jwt.access-token-ttl-seconds=3600

# Database web-view optimization
spring.jpa.open-in-view=false

# Versioned schema management. Existing non-empty databases are baselined at V3.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=3
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# Frontend browser origins (comma-separated in Render environment)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Render health checks and safe error responses
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.error.include-message=never
server.error.include-stacktrace=never
